name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Godot plus only its Android export templates (the full .tpz is ~1 GB).
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot/templates
          cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates
          rm templates.tpz

      - name: Set up Godot
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl" && cp ~/godot/templates/* "$tpl/"
          # Editor settings: SDK, JDK and the repo's fixed debug key for signing.
          mkdir -p ~/.config/godot
          for name in "editor_settings-${GODOT_VERSION%.*}.tres" "editor_settings-4.tres"; do
            cat > ~/.config/godot/"$name" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/signing/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      # The run number becomes the Android versionCode, so every build installs
      # as an update, and the title screen shows which build you're on.
      - name: Stamp version
        run: |
          v="1.0.${GITHUB_RUN_NUMBER}"
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"${v}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${v}\"/" project.godot
          grep -E "^version/|^config/version" export_presets.cfg project.godot

      - name: Import project
        run: |
          timeout 300 godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error" import.log; then exit 1; fi

      # Plays group, 指名 and two-player rounds headless; fails on any script error.
      - name: Smoke test
        run: |
          timeout 240 godot --headless --path . res://tests/smoke.tscn 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" smoke.log; then exit 1; fi

      - name: Export APK
        run: |
          mkdir -p build
          timeout 600 godot --headless --path . --export-debug "Android" build/bekuhai.apk 2>&1 | tee export.log
          test -f build/bekuhai.apk

      # Same SHA-256 every build (the committed debug key), so updates install.
      - name: Show signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs build/bekuhai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bekuhai-apk
          path: build/bekuhai.apk
          retention-days: 14

      # Same build plus x86_64 code, only for the emulator launch check below.
      - name: Export emulator APK
        run: |
          sed -i "s/^architectures\/x86_64=.*/architectures\/x86_64=true/" export_presets.cfg
          timeout 600 godot --headless --path . --export-debug "Android" build/bekuhai-x86_64.apk > /dev/null 2>&1
          git checkout export_presets.cfg
          test -f build/bekuhai-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: build/bekuhai-x86_64.apk
          retention-days: 3

      # Real rendering (software OpenGL under a virtual display) of the main
      # screens, for checking the look without a phone.
      - name: Render screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1080x1920x24" \
            timeout 300 godot --path . --rendering-driver opengl3 res://tests/shots.tscn -- --out "$PWD/shots" 2>&1 | tee shots.log
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        continue-on-error: true
        run: |
          test -n "$(ls shots/*.png 2>/dev/null)" || exit 0
          cp shots.log shots/ 2>/dev/null || true
          cd shots
          git init -q -b ci-screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

  # Boots an Android emulator, installs the build and launches it: catches
  # crashes on real Android that the desktop smoke test can't see.
  android-launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      # The emulator's default SwiftShader GL has a uniform limit too low for
      # Godot's canvas shader (grey screen); ANGLE renders it like a phone does.
      GPU: angle_indirect
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emulator-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu ${{ env.GPU }} -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p android
            adb install -r bekuhai-x86_64.apk
            adb logcat -c
            adb shell monkey -p com.seanw94.bekuhai -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > android/android_title.png
            adb shell pidof com.seanw94.bekuhai > android/pid.txt || echo "NOT RUNNING" > android/pid.txt
            adb logcat -d > android/logcat.txt
            cat android/pid.txt
            grep -E "FATAL EXCEPTION|SCRIPT ERROR|Fatal signal" android/logcat.txt || echo "no crash markers in logcat"

      - name: Check the app stayed up
        run: |
          grep -qv "NOT RUNNING" android/pid.txt
          ! grep -qE "FATAL EXCEPTION|Fatal signal" android/logcat.txt

      - name: Add the emulator screenshot to the ci-screenshots branch
        if: always()
        continue-on-error: true
        run: |
          test -f android/android_title.png || exit 0
          gpu="$GPU"
          for attempt in 1 2 3 4 5; do
            rm -rf pub
            git clone -q --depth 1 -b ci-screenshots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pub
            cp android/android_title.png "pub/android_${gpu}.png"
            grep -iE "godot|bekuhai|FATAL|AndroidRuntime" android/logcat.txt | tail -200 > "pub/android_${gpu}_logcat.txt" || true
            (cd pub && git add . && git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "Emulator launch (${gpu}) for ${GITHUB_SHA}" && git push -q origin ci-screenshots) && break
            sleep $((attempt * 3))
          done
