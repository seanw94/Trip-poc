name: Build Bekuhai APK

on:
  push:
    branches: [main]
    paths:
      - "bekuhai/**"
      - ".github/workflows/bekuhai.yml"
      - "app/debug.keystore"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Godot plus only its Android export templates (the full .tpz is ~1 GB).
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot/templates
          cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d templates
          rm templates.tpz

      - name: Set up Godot
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl" && cp ~/godot/templates/* "$tpl/"
          # Editor settings: SDK, JDK and the repo's fixed debug key for signing.
          mkdir -p ~/.config/godot
          for name in "editor_settings-${GODOT_VERSION%.*}.tres" "editor_settings-4.tres"; do
            cat > ~/.config/godot/"$name" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/app/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Import project
        run: timeout 300 godot --headless --path bekuhai --import

      # Plays three full rounds headless; fails on script errors or a stall.
      - name: Smoke test
        run: |
          timeout 180 godot --headless --path bekuhai res://tests/smoke.tscn 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" smoke.log; then exit 1; fi

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/app/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p bekuhai/build
          timeout 600 godot --headless --path bekuhai --export-debug "Android" build/bekuhai.apk 2>&1 | tee export.log
          test -f bekuhai/build/bekuhai.apk

      # Should print the same SHA-256 as the Tanuki POC (shared debug key).
      - name: Show signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs bekuhai/build/bekuhai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bekuhai-debug
          path: bekuhai/build/bekuhai.apk
          retention-days: 14
